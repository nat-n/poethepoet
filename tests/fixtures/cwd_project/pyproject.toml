[tool.poe.tasks.default_pwd]
cmd = "poe_test_pwd"

[tool.poe.tasks.cwd]
cmd = "poe_test_pwd"
cwd = "./subdir/foo"

[tool.poe.tasks.cwd_env]
cmd = "poe_test_pwd"
cwd = "./subdir/${BAR_ENV}"

[tool.poe.tasks.cwd_poe_pwd]
cmd = "poe_test_pwd"
cwd = "${POE_PWD}"

[tool.poe.tasks.show_poe_pwd]
cmd = "poe_test_echo ${POE_PWD} ${POE_CWD}"

[tool.poe.tasks.cwd_arg]
cmd = "poe_test_pwd"
cwd = "./subdir/${foo_var}"
args = ["foo_var"]

[tool.poe.tasks.ls]
cmd = "ls ${path_arg}"
cwd = "${cwd_arg}"
env = {VIRTUAL_ENV = ""}
args = ["cwd-arg", "path-arg"]
